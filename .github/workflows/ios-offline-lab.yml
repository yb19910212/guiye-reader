name: iOS Offline Voice Lab
on:
  workflow_dispatch:
  push:
    branches: [codex/api-voice-lite]
    paths:
      - '.github/workflows/ios-offline-lab.yml'
      - 'ios/GuiyeReader/OfflineVoiceLab.swift'
      - 'ios/GuiyeReader/OfflineModelFiles.swift'
      - 'ios/GuiyeReader/SpeechEngine.swift'
      - 'ios/GuiyeReader/SystemSpeechEngine.swift'
      - 'ios/GuiyeReader/ReaderView.swift'
      - 'ios/GuiyeReader/ReaderViewModel.swift'
      - 'ios/Tests/SpeechQueueSmoke.swift'
      - 'ios/Tests/OfflineModelFilesSmoke.swift'
      - 'scripts/prepare_qwen_model.py'
      - 'scripts/configure_qwen_lab.py'
      - 'scripts/verify_qwen_lab.py'
      - 'scripts/qwen-tokenizer-smoke/**'
      - 'vendor/Qwen3TTS/**'
permissions:
  contents: write
concurrency:
  group: ios-offline-lab
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify complete pinned model
        run: |
          pip install transformers==4.57.3 tokenizers==0.22.2
          python scripts/prepare_qwen_model.py ios/GuiyeReader/QwenSupport
      - name: Run Swift tokenizer parity test before app build
        run: swift run --package-path scripts/qwen-tokenizer-smoke QwenTokenizerSmoke "$PWD/ios/GuiyeReader/QwenSupport"
      - name: Existing reader regression tests
        run: |
          xcrun swiftc ios/GuiyeReader/OfflineModelFiles.swift ios/Tests/OfflineModelFilesSmoke.swift -o /tmp/model-files-smoke
          /tmp/model-files-smoke
          xcrun swiftc ios/GuiyeReader/TXTParser.swift ios/Tests/TXTParserSmoke.swift -o /tmp/txt-smoke
          /tmp/txt-smoke
          xcrun swiftc ios/GuiyeReader/SpeechEngine.swift ios/Tests/SpeechQueueSmoke.swift -o /tmp/queue-smoke
          /tmp/queue-smoke
      - name: Enable isolated lab and build unsigned app
        run: |
          python scripts/configure_qwen_lab.py
          xcodebuild -project ios/GuiyeReader.xcodeproj -scheme GuiyeReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CONFIGURATION_BUILD_DIR="$PWD/ios/build-unsigned" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify experimental IPA
        run: |
          mkdir -p ios/package/Payload
          cp -R ios/build-unsigned/GuiyeReader.app ios/package/Payload/
          (cd ios/package && zip -qry ../GuiyeReader-ios-offline-lab-unsigned.ipa Payload)
          python scripts/verify_qwen_lab.py ios/GuiyeReader-ios-offline-lab-unsigned.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-lab-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: iOS 离线语音实验版 ${{ github.run_number }}
          prerelease: true
          body: |
            独立实验版，非流畅度验收通过的正式版。Android 及现有轻量版不变。
            v0.18.1：连续生成内存优化实验修复，仍需真机验收。
            解码前释放生成 KV 缓存；逐段释放临时对象和 MLX 缓存；显示活跃内存及历史峰值。
            内存警告与前台中断分开提示；内存警告时取消生成，但保留已备音频播放后暂停。
            磁盘缓存自动淘汰未使用的旧音频，保护待播音频；实验室增加连续20段真实推理记录。
            智能语音 → 本地离线音色 → 返回正文播放；不需要 API 密钥，不上传正文。
            最多 40 字短句、两段预缓冲、段间模型复用、音频缓存、整章预缓存、取消与切换隔离。
            限前台推理，锁屏/离开前台/内存警告时停止；温度过高时停止新生成。建议先用 1×。
            两个模型权重、分词器、1号/4号参考音色全部打入 IPA。
            安装后无需再下载或导入模型。直接读取包内资源，不额外复制权重，不随阅读器启动加载。
            书库 → 更多 → 离线语音实验室 → 校验内置模型，再断网测试 1号、4号。
            修复 tokenizer.json 缺失：从固定版本词表生成并通过 Swift/Python 分词一致性检查。
            模型原始文件约 1.7 GB，安装及签名请预留足够空间。包内权重按固定 SHA256 校验。
            API 与系统朗读保留，不自动回退上传正文。EPUB/PDF 与 Android 不变。尚需长时间真机连续朗读、内存和发热验收。
            iOS 未签名 IPA，需要自行签名安装。
          files: ios/GuiyeReader-ios-offline-lab-unsigned.ipa

name: Mobile CI

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify published Build 51 only, without rebuilding
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ !inputs.verify_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug
      - name: Check lightweight package
        run: python3 scripts/verify_lite_package.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GuiyeReader-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  ios:
    if: ${{ !inputs.verify_release }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Large TXT performance smoke test
        run: |
          xcrun swiftc ios/GuiyeReader/TXTParser.swift ios/Tests/TXTParserSmoke.swift -o /tmp/txt-parser-smoke
          /tmp/txt-parser-smoke
      - name: Speech queue regression checks
        run: |
          xcrun swiftc ios/GuiyeReader/SpeechEngine.swift ios/Tests/SpeechQueueSmoke.swift -o /tmp/speech-queue-smoke
          /tmp/speech-queue-smoke
      - name: Build unsigned device app
        run: >-
          xcodebuild -project ios/GuiyeReader.xcodeproj
          -scheme GuiyeReader -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          CONFIGURATION_BUILD_DIR="$PWD/ios/build-unsigned"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p ios/package/Payload
          cp -R ios/build-unsigned/GuiyeReader.app ios/package/Payload/
          cd ios/package
          zip -qry ../GuiyeReader-unsigned.ipa Payload
      - name: Check lightweight package
        run: python3 scripts/verify_lite_package.py ios/GuiyeReader-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: GuiyeReader-ios-unsigned
          path: ios/GuiyeReader-unsigned.ipa
          retention-days: 1

  release:
    if: ${{ !inputs.verify_release && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GuiyeReader-android-debug
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: GuiyeReader-ios-unsigned
          path: release
      - name: Prepare release files
        run: mv release/app-debug.apk release/GuiyeReader-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Guiye Reader ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          generate_release_notes: true
          prerelease: true
          body: |
            v0.16.0 章节语音缓存版
            - 双端加入 TXT 本章缓存后播放，取消重试复用已完成音频，200 MB 可清理缓存
            - 断句优先句末与标点，校验 WAV 完整性；变速不重新请求 API
            - 显示缓存段数、命中数、等待计时、音频时长与播放进度
            - HTTPS API 设置、设备安全密钥存储、1号和4号音色、可取消的有界预取
            - 明确显示服务器等待状态；生成速度由 NAS 决定，不承诺无间断朗读
            - TXT 章节选择、前后章跳转；保留 EPUB 原生目录
            - 本版尚需 iOS / Android 真机滚动、切换、后台播放验收
            - iOS 为未签名 IPA，Android 为 Debug 签名 APK
          files: |
            release/GuiyeReader-android.apk
            release/GuiyeReader-unsigned.ipa

  verify_published:
    if: ${{ inputs.verify_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Download final Build 51 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-51 --dir final-release
      - name: Verify final file hashes and archive resources
        run: |
          echo 'f232c732bac4e70240d956a8c28a2ef1d4577ebc6f89b18b8099e71c2002834e  final-release/GuiyeReader-android.apk' | sha256sum -c -
          echo 'c39169210434a23016ec21b8fdf3890ba99676c126f36effae32bf2d8012e02f  final-release/GuiyeReader-unsigned.ipa' | sha256sum -c -
          python3 scripts/verify_mobile_release.py final-release

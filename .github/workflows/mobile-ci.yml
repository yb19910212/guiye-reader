name: Mobile CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GuiyeReader-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Build unsigned device app
        run: >-
          xcodebuild -project ios/GuiyeReader.xcodeproj
          -scheme GuiyeReader -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          CONFIGURATION_BUILD_DIR="$PWD/ios/build-unsigned"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p ios/package/Payload
          cp -R ios/build-unsigned/GuiyeReader.app ios/package/Payload/
          cd ios/package
          zip -qry ../GuiyeReader-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GuiyeReader-ios-unsigned
          path: ios/GuiyeReader-unsigned.ipa
